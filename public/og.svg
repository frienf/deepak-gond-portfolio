      <stop offset="0" stop-color="#12161f" />
      <stop offset="1" stop-color="#0d1117" />
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#4fd8e4" stop-opacity="0.22" />
      <stop offset="1" stop-color="#4fd8e4" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#2b3444" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Pipeline lattice: many raw nodes resolving into one insight -->
