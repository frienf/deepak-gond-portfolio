    <circle cx="800" cy="330" r="4" opacity="0.7" /><circle cx="800" cy="420" r="4" opacity="0.7" />
    <circle cx="800" cy="500" r="4" opacity="0.7" /><circle cx="860" cy="180" r="3" opacity="0.5" />
    <circle cx="860" cy="460" r="3" opacity="0.5" />
    <circle cx="950" cy="250" r="7" opacity="0.85" /><circle cx="950" cy="300" r="7" opacity="0.85" />
    <circle cx="950" cy="350" r="7" opacity="0.85" />
