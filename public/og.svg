<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17110a" />
      <stop offset="1" stop-color="#110c07" />
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fd8e4" stop-opacity="0.18" />
      <stop offset="1" stop-color="#4fd8e4" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#3a3228" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.45" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Pipeline lattice: many raw nodes resolving into one insight.
       fill="none" is load-bearing - without it each polyline fills black. -->
  <g fill="none" stroke="#4fd8e4" stroke-opacity="0.32" stroke-width="1.1">
    <path d="M800 140 950 250 1080 315" />
    <path d="M800 240 950 250 1080 315" />
    <path d="M800 330 950 300 1080 315" />
    <path d="M800 420 950 350 1080 315" />
    <path d="M800 500 950 350 1080 315" />
    <path d="M860 180 950 250" />
    <path d="M860 460 950 350" />
  </g>

  <g fill="#4fd8e4">
    <circle cx="800" cy="140" r="4" opacity="0.7" /><circle cx="800" cy="240" r="4" opacity="0.7" />
    <circle cx="800" cy="330" r="4" opacity="0.7" /><circle cx="800" cy="420" r="4" opacity="0.7" />
    <circle cx="800" cy="500" r="4" opacity="0.7" /><circle cx="860" cy="180" r="3" opacity="0.5" />
    <circle cx="860" cy="460" r="3" opacity="0.5" />
    <circle cx="950" cy="250" r="7" opacity="0.9" /><circle cx="950" cy="300" r="7" opacity="0.9" />
    <circle cx="950" cy="350" r="7" opacity="0.9" />
  </g>
  <circle cx="1080" cy="315" r="34" fill="#ffa160" opacity="0.16" />
  <circle cx="1080" cy="315" r="13" fill="#ffa160" />

  <text x="80" y="150" fill="#4fd8e4" font-family="JetBrains Mono, monospace" font-size="20" letter-spacing="4">
    DATA ANALYST &#183; DATA ENGINEERING
  </text>
  <text x="80" y="268" fill="#fbfcfe" font-family="Instrument Serif, Georgia, serif" font-size="86">
    Turning data into
  </text>
  <text x="80" y="356" fill="#4fd8e4" font-family="Instrument Serif, Georgia, serif" font-size="86">
    decisions.
  </text>
  <text x="80" y="420" fill="#b9b2a7" font-size="25">Deepak Jaygopal Gond &#183; Mumbai, India</text>

  <!-- Three columns, 230px apart; labels capped at 15px so 21 characters
       of mono (~189px) cannot run into the next column. -->
  <g font-family="JetBrains Mono, monospace">
    <text x="80" y="520" fill="#ffa160" font-size="40">40%</text>
    <text x="80" y="548" fill="#8f877c" font-size="15">less manual reporting</text>
    <text x="310" y="520" fill="#ffa160" font-size="40">35%</text>
    <text x="310" y="548" fill="#8f877c" font-size="15">collection efficiency</text>
    <text x="540" y="520" fill="#ffa160" font-size="40">30%</text>
    <text x="540" y="548" fill="#8f877c" font-size="15">on-time delivery</text>
  </g>
  <rect x="80" y="576" width="640" height="1" fill="#3a3228" />
</svg>
