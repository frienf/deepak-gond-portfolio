<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1117" />

  <title>Deepak Gond — Data Analyst | Data Engineering</title>
  <!-- 151 chars. Google truncates around 155-160 on desktop, so this stays
       whole in the SERP; the previous 216-char version was cut mid-clause. -->
  <meta name="description" content="Mumbai-based Data Analyst skilled in SQL, Python, Power BI and ETL. Built automated dashboards and ERP pipelines that cut manual reporting time by 40%." />
  <meta name="author" content="Deepak Jaygopal Gond" />
  <!-- Pages subpath, matching `base` in vite.config.js. Vite does prefix the
       base onto root-relative URLs here, including meta content such as
       twitter:image - but that still leaves a path, and scrapers need a
       fully-qualified URL. So canonical, og:url, og:image, twitter:image and
       the JSON-LD below are written out in full. Move them together. -->
  <link rel="canonical" href="https://frienf.github.io/deepak-gond-portfolio/" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Deepak Gond — Data Analyst | Data Engineering" />
  <meta property="og:description" content="I build data systems, analytics workflows and dashboards that turn operational data into measurable business impact. SQL · Python · Power BI · ETL · ERP integration." />
  <meta property="og:url" content="https://frienf.github.io/deepak-gond-portfolio/" />
  <!-- Generated from public/og.svg by `npm run og`. Edit the SVG, not the PNG. -->
  <meta property="og:image" content="https://frienf.github.io/deepak-gond-portfolio/og.png" />
  <meta property="og:image:alt" content="Deepak Gond — Data Analyst and Data Engineering portfolio" />
  <meta property="og:locale" content="en_IN" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Deepak Gond — Data Analyst | Data Engineering" />
  <meta name="twitter:description" content="Analytics, automation and data engineering — turning operational data into decisions." />
  <meta name="twitter:image" content="https://frienf.github.io/deepak-gond-portfolio/og.png" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- iOS ignores an SVG here and screenshots the page instead, so the
       monogram ships as a PNG too. Both are generated by `npm run og`. -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Type is self-hosted (see src/styles/fonts.css). The two fonts the
       first screen needs are preloaded so they arrive with the stylesheet
       rather than one round trip behind it. -->
  <link rel="preload" href="/fonts/instrument-serif-latin-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Deepak Jaygopal Gond",
      "jobTitle": "Data Analyst",
      "email": "mailto:gonddeepak786@gmail.com",
      "url": "https://frienf.github.io/deepak-gond-portfolio/",
      "image": "https://frienf.github.io/deepak-gond-portfolio/og.png",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Mumbai",
        "addressRegion": "Maharashtra",
        "addressCountry": "IN"
      },
      "sameAs": [
        "https://www.linkedin.com/in/deepak-gond/",
        "https://github.com/frienf",
        "https://leetcode.com/u/dgond"
      ],
      "knowsAbout": [
        "Data Analysis", "Data Engineering", "SQL", "Python", "Power BI",
        "ETL", "Data Warehousing", "Dashboards", "Automation", "ERPNext"
      ],
      "alumniOf": [
        { "@type": "CollegeOrUniversity", "name": "BK Birla College, University of Mumbai" },
        { "@type": "CollegeOrUniversity", "name": "Rizvi College, University of Mumbai" }
      ],
      "worksFor": { "@type": "Organization", "name": "Voraco Distributors Pvt. Ltd." }
    }
  </script>

  <!-- Reveal animations hide content only when scripting is available, so
       the page is fully readable with JavaScript off. -->
  <script>
    document.documentElement.classList.add('js');
    // Applied before first paint: reading this in React instead would show
    // a frame of the wrong theme on every load.
    try {
      if (localStorage.getItem('portfolio-theme') === 'light') {
        document.documentElement.dataset.theme = 'light';
      }
    } catch (e) { /* storage blocked - dark default is fine */ }
  </script>

  <script type="module" src="/src/main.jsx"></script>
</head>
<body>

  <div id="root"></div>

  <!-- The no-JS fallback that used to live here is gone: the build now
       pre-renders the whole page into #root, so there is nothing left for
       it to stand in for. Keeping it would also have put a second level-one
       heading on the page, which crawlers read even inside a noscript
       block. Tag names are spelled out here on purpose - a literal one in
       this comment gets counted by naive grep audits. -->
